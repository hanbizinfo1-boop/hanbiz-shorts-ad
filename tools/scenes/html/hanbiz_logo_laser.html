    const P = PATHS.paths.find(p => p.id === c.id);
    const mk = (w, stroke, op, filt, cap) => { const a = { d: P.d, fill: 'none', stroke, 'stroke-width': w, 'stroke-linecap': cap || 'round', 'stroke-linejoin': 'round', opacity: op };
      if (filt) a.filter = 'url(#' + filt + ')'; return el('path', a, gLines); };
    const s = { c, d: P.d, len: 0, layers: {} };
    s.geom = el('path', { d: P.d, fill: 'none', stroke: 'none' }, svg); s.len = s.geom.getTotalLength();
    const L = s.layers;
    // 밝은 바탕: 색 번짐은 normal 블렌드로 얇게, 코어는 진한 획 색(날카롭게, 블러 없음), 그 위에 흰 1px 하이라이트(일부 구간만)
    L.halo = mk(40, c.halo, 0.13, 'b20'); L.glow = mk(11, c.grad, 0.30, 'b4'); L.core = mk(3, c.grad, 1, null); L.hi = mk(1.1, '#fff', 0.95, null, 'butt');
    // 머리 뒤 꼬리 3단(길수록 약하고 짧을수록 진하다)
    L.t1g = mk(15, c.grad, 0.30, 'b4');  L.t1l = 330;
    L.t2g = mk(20, c.grad, 0.45, 'b9'); L.t2c = mk(4.2, c.grad, 1, null); L.t2l = 130;
    L.t3g = mk(28, c.grad, 0.6, 'b9');  L.t3c = mk(5.5, c.grad, 1, null); L.t3l = 42;
    L.t2w = mk(1.4, '#fff', 0.9, null); L.t3w = mk(2, '#fff', 1, null);
    // 머리: 색 번짐 + 색 십자 빛 + 흰 코어 + 획 색 링
    s.hb = el('circle', { r: 70, fill: c.bloom }, gHeads);
    s.hf1 = el('ellipse', { rx: 150, ry: 6, fill: c.cross }, gHeads);
    s.hf2 = el('ellipse', { rx: 5, ry: 88, fill: c.cross }, gHeads);
    s.hf1w = el('ellipse', { rx: 60, ry: 1.6, fill: 'url(#rWhite)' }, gHeads);
    s.hf2w = el('ellipse', { rx: 1.6, ry: 36, fill: 'url(#rWhite)' }, gHeads);
    s.hdb = el('circle', { r: 15, fill: 'none', stroke: c.ring, 'stroke-width': 5, filter: 'url(#b4)' }, gHeads);
    s.hr = el('circle', { r: 12, fill: 'none', stroke: c.ring, 'stroke-width': 3 }, gHeads);
    s.hd = el('circle', { r: 8.5, fill: '#fff' }, gHeads);
    // 불꽃 입자(시드 고정)
    const N = 16;
    for (let i = 0; i < N; i++) {
      const ts = c.t0 + c.D * (0.04 + 0.9 * (i + hash(i, ci + 1)) / N);
      const h = s.len * headEase((ts - c.t0) / c.D);
      const p = s.geom.getPointAtLength(h), p2 = s.geom.getPointAtLength(Math.min(s.len, h + 3)), p1 = s.geom.getPointAtLength(Math.max(0, h - 3));
      let tx = p2.x - p1.x, ty = p2.y - p1.y; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const side = hash(i, 5 + ci) < 0.5 ? -1 : 1, ang = 0.4 + 1.0 * hash(i, 9 + ci);      // 진행 방향 옆으로 튀어 나감
      const nx = -ty * side, ny = tx * side, vs = 140 + 220 * hash(i, 13 + ci);
      const vx = (nx * Math.cos(ang) - tx * Math.sin(ang) * 0.6) * vs, vy = (ny * Math.cos(ang) - ty * Math.sin(ang) * 0.6) * vs;
      sparks.push({ ts, x: p.x, y: p.y, vx, vy, r: 2.4 + 2.2 * hash(i, 17 + ci), life: 0.38 + 0.25 * hash(i, 21 + ci),
                    node: el('circle', { r: 2, fill: c.spark[i % 2] }, gSparks) });
    }
    strokes.push(s);
  });

  // 먼지(정적) — 시드 고정
  const dl = document.getElementById('dust');
  for (let i = 0; i < 38; i++) {
    const d = document.createElement('div'); d.className = 'speck';
    const sz = 2 + 2.5 * hash(i, 3);
    d.style.cssText = `left:${(1080 * hash(i, 1)).toFixed(1)}px;top:${(1920 * hash(i, 2)).toFixed(1)}px;width:${sz.toFixed(1)}px;height:${sz.toFixed(1)}px;background:${hash(i, 4) < 0.5 ? '#8B93A3' : COL.blue}`;
    dl.appendChild(d); dust.push({ node: d, o: 0.1 + 0.25 * hash(i, 6) });
  }
  await Promise.all([S.fill, S.hl, S.wordKo, S.wordEn].map(im => im.decode()));
}

function dash(p, s, e) {                       // 길이 [s,e] 구간만 그린다(닫힌 경로 시작점 기준)
  s = Math.max(0, s);
  const n = e - s;
  if (n < 0.6) { p.style.display = 'none'; return; }
  p.style.display = '';
  p.style.strokeDasharray = n.toFixed(2) + ' 20000';
  p.style.strokeDashoffset = (-s).toFixed(2);
}

async function seek(t) {
  await document.fonts.ready;
  await build();

  // HUD·격자·먼지: 0~0.3 페이드 인 후 그대로
  const hi = eoC(t / 0.3);
  S.hud.style.opacity = hi.toFixed(4);
  S.grid.style.opacity = (0.05 * hi).toFixed(4);
  dust.forEach(d => d.node.style.opacity = (d.o * 0.6 * hi).toFixed(3));

  // 점화 번쩍(0→1→0) · 선 사라짐
  const f = eoC((t - T.ign) / 0.08) * (1 - eoC((t - T.ign - 0.08) / 0.35));
  const lineA = 1 - eoC((t - T.lineFade) / T.lineFadeD);

  strokes.forEach(s => {
    const c = s.c, L = s.layers;
    const x = (t - c.t0) / c.D, done = x >= 1;
    const h = s.len * headEase(x);
    const on = t >= c.t0;
    // 이미 그려진 선(식은 상태) — 점화 때는 색 펄스로 한 번 퍼졌다 사라진다
    dash(L.halo, 0, on ? h : 0); dash(L.glow, 0, on ? h : 0); dash(L.core, 0, on ? h : 0);
    L.halo.setAttribute('stroke-width', (40 * (1 + 1.1 * f)).toFixed(2)); L.halo.setAttribute('opacity', (0.13 + 0.40 * f).toFixed(3));
    L.glow.setAttribute('stroke-width', (11 * (1 + 1.2 * f)).toFixed(2)); L.glow.setAttribute('opacity', (0.30 + 0.35 * f).toFixed(3));
    L.core.setAttribute('stroke-width', (3 * (1 + 0.6 * f)).toFixed(2));
    // 흰 하이라이트: 46px 켜짐 / 150px 꺼짐 반복(일부 구간만), 그려진 길이까지
    if (on && h > 1) { const arr = []; let pos = 0; while (pos < h) { arr.push(Math.min(46, h - pos).toFixed(1), 150); pos += 196; } arr[arr.length - 1] = 20000;
      L.hi.style.display = ''; L.hi.style.strokeDasharray = arr.join(' '); L.hi.style.strokeDashoffset = '0'; } else L.hi.style.display = 'none';
    // 꼬리(머리가 가는 동안만)
    const tailOn = on && !done;
    [['t1g', 't1l'], ['t2g', 't2l'], ['t2c', 't2l'], ['t2w', 't2l'], ['t3g', 't3l'], ['t3c', 't3l'], ['t3w', 't3l']].forEach(([k, lk]) => dash(L[k], tailOn ? h - L[lk] : 0, tailOn ? h : 0));
    // 머리
    const head = on && x < 1 + 0.12 / c.D ? 1 - clamp((x - 1) * c.D / 0.12) : 0;
    const p = s.geom.getPointAtLength(clamp(h, 0, s.len));
    const vis = head > 0.001 ? '' : 'none';
    [s.hb, s.hf1, s.hf2, s.hf1w, s.hf2w, s.hd, s.hdb, s.hr].forEach(n => n.style.display = vis);
    if (head > 0.001) {
      const fl = 0.9 + 0.1 * Math.sin(t * 90);          // 약한 깜빡임(결정적)
      s.hb.setAttribute('cx', p.x); s.hb.setAttribute('cy', p.y); s.hb.setAttribute('opacity', (0.9 * head).toFixed(3));
      s.hf1.setAttribute('cx', p.x); s.hf1.setAttribute('cy', p.y); s.hf1.setAttribute('rx', (150 * fl * head).toFixed(1)); s.hf1.setAttribute('opacity', head.toFixed(3));
      s.hf2.setAttribute('cx', p.x); s.hf2.setAttribute('cy', p.y); s.hf2.setAttribute('ry', (88 * fl * head).toFixed(1)); s.hf2.setAttribute('opacity', head.toFixed(3));
      s.hf1w.setAttribute('cx', p.x); s.hf1w.setAttribute('cy', p.y); s.hf1w.setAttribute('rx', (60 * fl * head).toFixed(1)); s.hf1w.setAttribute('opacity', head.toFixed(3));
      s.hf2w.setAttribute('cx', p.x); s.hf2w.setAttribute('cy', p.y); s.hf2w.setAttribute('ry', (36 * fl * head).toFixed(1)); s.hf2w.setAttribute('opacity', head.toFixed(3));
      s.hr.setAttribute('cx', p.x); s.hr.setAttribute('cy', p.y); s.hr.setAttribute('opacity', head.toFixed(3));
      s.hd.setAttribute('cx', p.x); s.hd.setAttribute('cy', p.y); s.hd.setAttribute('opacity', head.toFixed(3));
      s.hdb.setAttribute('cx', p.x); s.hdb.setAttribute('cy', p.y); s.hdb.setAttribute('opacity', head.toFixed(3));
    }
  });
  document.getElementById('lasers').style.opacity = lineA.toFixed(4);

  // 불꽃 입자
  sparks.forEach(sp => {
    const age = t - sp.ts;
    if (age < 0 || age > sp.life) { sp.node.style.display = 'none'; return; }
    const u = age / sp.life, e = 1 - Math.pow(1 - u, 2);
    sp.node.style.display = '';
    sp.node.setAttribute('cx', (sp.x + sp.vx * sp.life * 0.55 * e).toFixed(2));
    sp.node.setAttribute('cy', (sp.y + sp.vy * sp.life * 0.55 * e + 260 * age * age).toFixed(2));
    sp.node.setAttribute('r', (sp.r * (1 - 0.6 * u)).toFixed(2));
    sp.node.setAttribute('opacity', Math.pow(1 - u, 1.4).toFixed(3));
  });

  // 심볼 위로(80px) — 레이저 단계 동안은 아래에 있다가 빛 줄기와 함께 올라온다
  const m = eoC((t - T.move) / T.moveD);
  S.sym.style.transform = `translateY(${(80 * (1 - m)).toFixed(3)}px)`;

  // 채움: 윤곽 안이 원본 색으로 차오름(밝은 바탕이라 하얗게 날리지 않고 채도·밝기만 살짝) + 색 펄스(획 색 번짐이 한 번 퍼졌다 사라짐)
  const fp = eoC((t - T.fill) / T.fillD);
  S.fill.style.opacity = eoC((t - T.fill) / 0.14).toFixed(4);
  S.fill.style.filter = fp >= 1 ? 'none' : `brightness(${(1 + 0.35 * (1 - fp)).toFixed(3)}) saturate(${(1 + 0.5 * (1 - fp)).toFixed(3)})`;
  const pu = clamp((t - T.ign) / 1.0), bl = eoC((t - T.ign) / 0.22) * (1 - eoC((t - T.ign - 0.22) / 0.8));
  S.bloomB.style.opacity = (0.95 * bl).toFixed(4); S.bloomW.style.opacity = (0.95 * bl).toFixed(4);
  const sc = (0.7 + 0.55 * eoC(pu)).toFixed(3);
  S.bloomB.style.transform = `scale(${sc})`; S.bloomW.style.transform = `scale(${sc})`;

  // 사선 빛 줄기(로고 모양 안에서만 — 같은 이미지 복사본에 마스크)
  const sw = clamp((t - T.sweep) / T.sweepD);
  const c0 = -18 + 136 * sw;      // 왼 → 오 (등속)
  const mask = `linear-gradient(105deg, transparent ${(c0 - 13).toFixed(2)}%, #000 ${c0.toFixed(2)}%, transparent ${(c0 + 13).toFixed(2)}%)`;
  S.hl.style.webkitMaskImage = mask; S.hl.style.maskImage = mask;
  S.hl.style.opacity = (sw > 0 && sw < 1 ? 0.95 : 0).toFixed(3);

  // 한글 줄 왼→오 마스크 와이프 + 경계를 따라 지나가는 밝은 선, 영문 줄 페이드
  const kp = eoC((t - T.ko) / T.koD);
  const edge = 100 * kp * 1.1;
  const wm = `linear-gradient(90deg, #000 ${(edge - 10).toFixed(2)}%, transparent ${edge.toFixed(2)}%)`;
  S.wordKo.style.webkitMaskImage = wm; S.wordKo.style.maskImage = wm;
  S.wordKo.style.opacity = t >= T.ko ? 1 : 0;
  const frontX = 140 + 800 * clamp((edge - 5) / 100, 0, 1.02);
  S.wipe.style.left = frontX.toFixed(2) + 'px';
  S.wipe.style.opacity = (t >= T.ko && kp < 1 ? Math.min(1, kp * 10, (1 - kp) * 8) : 0).toFixed(4);
  S.wordEn.style.opacity = eoC((t - T.en) / T.enD).toFixed(4);
  return true;
}
window.seek = seek;
</script>
</body>
