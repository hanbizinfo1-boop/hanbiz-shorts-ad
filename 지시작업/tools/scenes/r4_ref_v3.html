<script>

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

function drawBig(t) {

      p.e.style.transform = `translateY(${(1 - eo(k)) * 22}px) scale(${0.9 + 0.1 * back(k) + 0.02 * clamp((t - p.t - 0.3) / 1.4)})`;
      p.e.style.filter = `blur(${(1 - eo(k)) * 5}px)`;

      for (const c of p.cnt) { const n = Math.round(+c.dataset.count * eo((t - p.t) / 0.7)); c.textContent = n + '번'; }
    }
    if (b.ringE) {

      const cx = rb.left - pb.left + rb.width / 2, cy = rb.top - pb.top + rb.height / 2, rx = rb.width / 2 + 34, ry = rb.height / 2 + 14;
      b.ringE.style.left = '0px'; b.ringE.style.top = '0px'; b.ringE.setAttribute('width', 1080); b.ringE.setAttribute('height', 300);

    }

}

Object.assign(C1.e.style, {position: 'absolute', left: '150px', width: '780px', top: '96px', height: '250px', borderRadius: '32px', background: '#fff',
  boxShadow: '0 22px 46px rgba(0,0,0,.35)', zIndex: 4});
// 자리마다 숫자 기둥(0~9,0) — 잔액이 오르는 동안 아랫자리일수록 빨리 돈다
const C1N = C1.e.querySelector('#c1n'); const LH = 96; const COLS = [];
for (const ch of '10,000,000,000원') {

function drawC1(t) {

  const k = clamp((t - C1.r0) / (C1.r1 - C1.r0)), v = C1.a + (C1.b - C1.a) * k * k * (3 - 2 * k);
