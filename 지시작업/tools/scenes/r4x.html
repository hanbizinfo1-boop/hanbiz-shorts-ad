<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 10-20 4번 앞 3.47초 — 강남빌딩 vs 예금·주식 인형 (사장님 원문·수치 근거는 지시작업/tools/r4x_build.py 머리)
     900×1600 · 59.94 · 사장님 자막(900~950px) 밑 공간. 화면 확대(1.969~2.10)는 V1 에 구웠고, 여기 «세계» 층도 같은 카메라로 같이 커진다. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:900px;height:1600px;overflow:hidden;background:transparent}
#st{position:relative;width:900px;height:1600px;overflow:hidden;font-family:"HM Pretendard",sans-serif}
#world{position:absolute;left:0;top:0;width:900px;height:1600px;transform-origin:0 0}
.obj{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform}
.obj img{display:block;width:100%;height:100%;object-fit:contain}
.tag{position:absolute;font-weight:900;color:#1d2433;letter-spacing:-1px;white-space:nowrap;transform-origin:50% 50%;opacity:.88;mix-blend-mode:multiply}
.fx{position:absolute;left:0;top:0;pointer-events:none}
</style></head>
<body><div id="st"><div id="world"></div></div>
<script>
window.W = 900; window.H = 1600; window.FPS = 59.94; window.DURATION = 3.47;
window.PALETTE = ['#ffffff', '#1d2433', '#FFD43B'];
const A = '../../소재/codex/';
const st = document.getElementById('st'), world = document.getElementById('world');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const ei = x => Math.pow(clamp(x), 2.2);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const spring = (x, f = 26, d = 7) => x <= 0 ? 0 : 1 - Math.cos(x * f) * Math.exp(-x * d);     // 0→1 튕기며 자리 잡음
const wob = (x, f = 30, d = 9) => x <= 0 ? 0 : Math.cos(x * f) * Math.exp(-x * d);            // 1→0 흔들림
function el(tag, cls, parent, box) { const e = document.createElement(tag); if (cls) e.className = cls; if (box) e.dataset.box = box; (parent || st).appendChild(e); return e; }

/* ── 카메라: r4x_build.ZOOM 과 같은 값(시작 1.969, 0.131초, 1.25배, 가운데 x +112) ── */
const CAM = {t0: 1.969, dur: 0.131, s: 1.0, dx: 0, cy: 0.562 * 1600};   /* 10-20 «말도안돼요 그거는 이쪽은 원본이 낫겠다» → 확대 없음 */
function camera(t) { const e = 1 - Math.pow(1 - clamp((t - CAM.t0) / CAM.dur), 3); return {s: 1 + (CAM.s - 1) * e, cx: 450 + CAM.dx * e}; }
const toScreen = (c, x, y) => [c.cx + c.s * (x - 450), CAM.cy + c.s * (y - CAM.cy)];
const toWorld = (c, X, Y) => [450 + (X - c.cx) / c.s, CAM.cy + (Y - CAM.cy) / c.s];

/* ── 손 궤적 — 바탕에서 60fps 프레임마다 직접 잼(10-20) ── */
const HAND = [[2.035, 260, 1460], [2.069, 280, 1360], [2.102, 280, 1260], [2.135, 260, 1200], [2.169, 260, 1140], [2.202, 200, 1080], [2.236, 140, 1040], [2.269, 40, 1040], [2.302, -40, 1080]];   /* 원본(확대 없음) 바탕에서 다시 잼 — _tmp/r4x/hand_nozoom.jpg */
function hand(t) { for (let i = 0; i < HAND.length - 1; i++) { const [a, ax, ay] = HAND[i], [b, bx, by] = HAND[i + 1]; if (t <= b) { const k = clamp((t - a) / (b - a)); return [lerp(ax, bx, k), lerp(ay, by, k)]; } } return HAND[HAND.length - 1].slice(1); }

/* ── 물체 ── */
function obj(src, h, aspect, box) { const o = el('div', 'obj', world, box); o.dataset.boxGroup = 'world'; o.dataset.boxBleed = ''; /* 빌딩·인형은 일부러 닿고(밀기) 화면 밖으로 나간다 */ const i = el('img', null, o); i.src = A + src; o.h = h; o.w = h * aspect; o.style.width = o.w + 'px'; o.style.height = h + 'px'; return o; }
function place(o, x, yb, sx = 1, sy = 1, rot = 0, op = 1) {   // x = 가운데, yb = 발(바닥) 높이
  o.style.transform = `translate(${x - o.w / 2}px,${yb - o.h}px) rotate(${rot}deg) scale(${sx},${sy})`; o.style.opacity = op; o.style.display = op > 0.001 ? 'block' : 'none';
}
const BLD = obj('r4x_building_a.png', 400, 857 / 1454, 'bld');
const F_PUSH = obj('r4x_fig_push_a.png', 330, 973 / 1126, 'fig_push');
const F_FLEX = obj('r4x_fig_flex_a.png', 384, 946 / 1457, 'fig_flex');
const F_HIT = obj('r4x_fig_hit_a.png', 350, 957 / 1255, 'fig_hit');
// 몸에 적힌 «예금»·«주식» — 자세마다 자리(그림 안 비율)·크기·기울기
function tags(o, spots) { return spots.map(([txt, fx, fy, size, rot]) => { const g = el('div', 'tag', o); g.textContent = txt; Object.assign(g.style, {left: (fx * 100) + '%', top: (fy * 100) + '%', fontSize: size + 'px', transform: `translate(-50%,-50%) rotate(${rot}deg)`}); return g; }); }
tags(F_PUSH, [['예금', .56, .40, 40, -24], ['주식', .66, .64, 34, -40]]);
tags(F_FLEX, [['예금', .50, .30, 46, 0], ['주식', .50, .47, 40, 0]]);
tags(F_HIT, [['예금', .56, .36, 40, 18], ['주식', .55, .52, 34, 10]]);

/* 효과: 먼지 · 충격 고리 · 빛줄기 · 꽃가루 · 맞는 섬광 */
const DUST = Array.from({length: 9}, (_, i) => { const d = el('div', 'fx', world); Object.assign(d.style, {width: '90px', height: '56px', borderRadius: '50%', background: 'radial-gradient(closest-side, rgba(235,228,215,.9), rgba(235,228,215,0))'}); d.a = (i / 8 - .5) * 2.4; return d; });
const RING = el('div', 'fx', world); Object.assign(RING.style, {width: '40px', height: '14px', borderRadius: '50%', border: '4px solid rgba(255,255,255,.9)'});
const POW = Array.from({length: 6}, (_, i) => { const p = el('div', 'fx', world); Object.assign(p.style, {width: '34px', height: '7px', borderRadius: '4px', background: '#FFD43B', transformOrigin: '0 50%'}); p.a = i; return p; });
const FLASH = el('div', 'fx', st); FLASH.innerHTML = '<svg width="260" height="260" viewBox="-130 -130 260 260"><circle r="70" fill="rgba(255,236,120,.55)"/><path fill="#fff" d="M0,-120 L22,-30 L110,-60 L40,0 L110,62 L20,30 L0,120 L-24,32 L-112,60 L-42,0 L-108,-62 L-22,-30Z"/></svg>';
const RAYS = el('div', 'fx', world); RAYS.style.filter = 'blur(3px)'; /* 투명 배경 렌더에서 screen 합성은 어둡게 찍힌다(10-20) */ RAYS.innerHTML = '<svg width="1100" height="1100" viewBox="-550 -550 1100 1100">' + Array.from({length: 16}, (_, i) => `<path d="M0,0 L${Math.cos(i / 16 * 6.283 - .09) * 560},${Math.sin(i / 16 * 6.283 - .09) * 560} L${Math.cos(i / 16 * 6.283 + .09) * 560},${Math.sin(i / 16 * 6.283 + .09) * 560}Z" fill="rgba(255,246,200,${i % 2 ? .22 : .12})"/>`).join('') + '</svg>';
let sd = 3; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
const CONF = Array.from({length: 46}, () => { const c = el('div', 'fx', st); const col = ['#FFD43B', '#ffffff', '#3DDC84', '#FFB020'][Math.floor(rnd() * 4)];
  Object.assign(c.style, {width: (10 + rnd() * 10) + 'px', height: (6 + rnd() * 8) + 'px', background: col, borderRadius: '2px'}); c.vx = (rnd() - .5) * 1500; c.vy = -900 - rnd() * 900; c.r = rnd() * 900; c.ph = rnd() * 6; return c; });

/* 효과음 계기(r4x_build.SFX_LIST 와 같은 순간) */
window.EVENTS = [{t: 0.42, role: 'slam'}, {t: 0.90, role: 'fig_in'}, {t: 1.12, role: 'push'}, {t: 1.45, role: 'flex'}, {t: 2.09, role: 'hit'}];

/* ── 연출 시간표(세계 좌표 = 확대 전 화면 좌표) ── */
const T = {land: 0.42, figIn: 0.884, contact: 1.08, pushEnd: 1.42, hit: 2.09, release: 2.236, back0: 99, back1: 99};
const BX = 450, BY = 1430;                      // 빌딩이 박히는 자리(자막 밑 가운데)
const FX_END = 150;                             // 인형이 근육 자랑하는 자리(손이 지나가는 곳)
function drawBuilding(t, c) {
  if (t < 0) return place(BLD, 0, 0, 1, 1, 0, 0);
  if (t < T.land) {                             // 오른쪽 위에서 사선으로 굽으며 날아와 자막 밑에 박힘
    const k = ei(t / T.land), p0 = [1180, -260], p1 = [980, 820], p2 = [BX, BY];
    const x = (1 - k) * (1 - k) * p0[0] + 2 * k * (1 - k) * p1[0] + k * k * p2[0], y = (1 - k) * (1 - k) * p0[1] + 2 * k * (1 - k) * p1[1] + k * k * p2[1];
    return place(BLD, x, y, 1 - .08 * (1 - k), 1 + .10 * (1 - k), 26 * (1 - k), 1);
  }
  const u = t - T.land;
  let x = BX, rot = 0, sx = 1 + .12 * wob(u, 34, 10), sy = 1 - .16 * wob(u, 34, 10);   // 박힐 때 찌그러졌다 튕김
  if (t >= T.contact) {                         // 인형에게 밀려 왼쪽으로(밀기 끝나도 미끄러져 화면 밖으로)
    const pk = eio((t - T.contact) / (T.pushEnd - T.contact));
    const slide = (t > T.pushEnd ? eo((t - T.pushEnd) / .35) : 0);
    x = lerp(BX, -60, pk) + lerp(0, -260, slide);
    rot = -7 * Math.sin(Math.PI * clamp((t - T.contact) / .7));
  }
  if (t >= T.back0) {                           // 인형이 날아간 뒤 가운데로 돌아와 커지며 빵빠레
    const c2 = c, k = spring((t - T.back0) * 1.0, 13, 5.5), [wx] = toWorld(c2, 450, 1560), [, wy] = toWorld(c2, 450, 1560);
    x = lerp(-300, wx, clamp(k, 0, 1.08)); rot = 8 * wob(t - T.back0, 12, 5);
    const g = 1 + .14 * clamp(spring((t - T.back0 - .06), 16, 6), 0, 1.2) + .012 * Math.sin((t - T.back1) * 5) * (t > T.back1 ? 1 : 0);
    return place(BLD, x, wy, g, g, rot, 1);
  }
  if (t > T.pushEnd + .5 && t < T.back0) return place(BLD, -400, BY, 1, 1, 0, 0);
  place(BLD, x, BY, sx, sy, rot, 1);
}
function drawDust(t) {
  const u = t - T.land;
  DUST.forEach(d => { const o = u > 0 && u < .6 ? (1 - u / .6) : 0; d.style.display = o > 0 ? 'block' : 'none'; d.style.opacity = o;
    const r = 60 + eo(u / .5) * 170; d.style.transform = `translate(${BX + Math.sin(d.a) * r - 45}px,${BY - 30 - Math.abs(Math.cos(d.a)) * 18 * eo(u / .3)}px) scale(${.6 + u * 1.6})`; });
  const rk = clamp(u / .3); RING.style.display = u > 0 && u < .3 ? 'block' : 'none'; RING.style.opacity = 1 - rk;
  RING.style.transform = `translate(${BX - 20}px,${BY - 7}px) scale(${1 + rk * 9},${1 + rk * 7})`;
}
function drawFigure(t, c) {
  // ① 오른쪽에서 달려 들어와 빌딩에 손을 댐 → 밀기
  const push = t >= T.figIn && t < T.pushEnd + .02;
  if (push) {
    const contactX = BX + BLD.w / 2 + F_PUSH.w / 2 - 22;
    let x;
    if (t < T.contact) x = lerp(1050, contactX, eo((t - T.figIn) / (T.contact - T.figIn)));
    else x = lerp(contactX, FX_END + 40, eio((t - T.contact) / (T.pushEnd - T.contact)));
    const lean = t < T.contact ? -6 * (1 - eo((t - T.figIn) / .2)) : -4 - 3 * Math.sin((t - T.contact) * 40) * .3;   // 들어올 때 뒤로 젖혔다 숙임 · 미는 동안 힘 떨림
    const bob = Math.abs(Math.sin((t - T.figIn) * 22)) * (t < T.contact ? 10 : 4);
    place(F_PUSH, x, 1428 - bob, 1, 1, lean, 1);
  } else place(F_PUSH, 0, 0, 1, 1, 0, 0);
  // ② 몸을 돌려 근육 자랑(찰칵 바뀔 때 통통 튐 · 두 번 힘주기)
  const flexOn = t >= T.pushEnd && t < T.hit + .01;
  if (flexOn) {
    const u = t - T.pushEnd, pop = 1 + .10 * wob(u, 28, 8);
    const pulse = 1 + .055 * (Math.exp(-Math.pow((t - 1.60) / .05, 2)) + Math.exp(-Math.pow((t - 1.84) / .05, 2)));
    place(F_FLEX, FX_END, 1412, pop * pulse * (1 + .01 * Math.sin(u * 9)), (2 - pop) * pulse, 0, 1);
    POW.forEach((p, i) => { const tt = [1.60, 1.84][i % 2], v = clamp(1 - Math.abs(t - tt - .06) / .12); p.style.display = v > 0 ? 'block' : 'none'; p.style.opacity = v;
      const a = (i < 3 ? -2.3 : -.84) + (i % 3 - 1) * .32, r = 150 + (1 - v) * 40; p.style.transform = `translate(${FX_END + Math.cos(a) * r}px,${1412 - 300 + Math.sin(a) * r}px) rotate(${a}rad)`; });
  } else { place(F_FLEX, 0, 0, 1, 1, 0, 0); POW.forEach(p => p.style.display = 'none'); }
  // ③ 대표님 손에 맞아 손을 따라 쓸려 올라가다(2.13~2.20) 손 속도 그대로 날아감(피융)
  if (t >= T.hit && t < 2.75) {
    const h0 = hand(T.hit), [fx0, fy0] = toScreen(camera(T.hit), FX_END, 1412), off = [fx0 - h0[0], fy0 - h0[1]];
    let X, Y, rot, sc = 1;
    if (t < T.release) { const h = hand(t), k = (t - T.hit) / (T.release - T.hit); X = h[0] + off[0] * (1 - .3 * k); Y = h[1] + off[1] * (1 - .3 * k); rot = -25 * k; }
    else { const hr = hand(T.release), u = t - T.release, v = [(hand(T.release)[0] - hand(T.release - .034)[0]) / .034 * .55, (hand(T.release)[1] - hand(T.release - .034)[1]) / .034 * .55 - 500];
      X = hr[0] + off[0] * .7 + v[0] * u; Y = hr[1] + off[1] * .7 + v[1] * u + 1600 * u * u; rot = -25 - 900 * u; sc = Math.max(.35, 1 - u * 1.4); }
    const [wx, wy] = toWorld(c, X, Y);
    place(F_HIT, wx, wy, sc, sc, rot, t < 2.65 ? 1 : 0);
  } else place(F_HIT, 0, 0, 1, 1, 0, 0);
  // 맞는 순간 섬광(화면 좌표)
  const fk = (t - T.hit) / .085;   /* 짧게 — 사라지며 남색 셔츠 위에서 회색 얼룩이 되지 않게(10-20) */ FLASH.style.display = fk > 0 && fk < 1 ? 'block' : 'none';
  if (fk > 0 && fk < 1) { const h = hand(T.hit + .01); FLASH.style.opacity = fk < .65 ? 1 : 1 - (fk - .65) / .35 * 1.0; FLASH.style.transform = `translate(${h[0] - 130}px,${h[1] - 130}px) scale(${.3 + eo(fk) * .38 + (fk > .65 ? (fk - .65) * .9 : 0)}) rotate(${fk * 30}deg)`;   /* 밝게 버티다 마지막에 커지며 빠르게 — 회색 반투명 단계 최소 */ }
}
function drawFanfare(t, c) {
  const u = t - 2.48;
  const [wx, wy] = toWorld(c, 450, 1560);
  const o = clamp(u / .15) * clamp((3.47 - t) / .1); RAYS.style.display = o > 0 ? 'block' : 'none'; RAYS.style.opacity = o;
  RAYS.style.transform = `translate(${wx - 550}px,${wy - 300 - 550}px) rotate(${u * 25}deg) scale(${.6 + .4 * eo(u / .3)})`;
  CONF.forEach(p => { const k = u - .02; if (k <= 0) { p.style.display = 'none'; return; } p.style.display = 'block'; p.style.opacity = clamp((1.1 - k) / .3);
    p.style.transform = `translate(${450 + p.vx * k}px,${1180 + p.vy * k + 1700 * k * k}px) rotate(${p.r * k + p.ph}rad) rotateX(${k * 600 + p.ph * 50}deg)`; });
}

let first = true;
window.seek = async function (t) {
  if (first) { first = false; await Promise.all([...st.querySelectorAll('img')].map(i => i.decode().catch(() => 0))); }
  const c = camera(t);
  world.style.transform = `translate(${c.cx - c.s * 450}px,${CAM.cy - c.s * CAM.cy}px) scale(${c.s})`;
  // 빛줄기는 빌딩 뒤 — 세계 층 맨 앞에 두고 순서로 뒤에 깔림
  if (RAYS.parentNode.firstChild !== RAYS) world.insertBefore(RAYS, world.firstChild);
  RAYS.style.display = 'none'; CONF.forEach(p => p.style.display = 'none');   /* 10-20 빵빠레 뺌(사장님 «팅겨져 나가는거까지만») */
  drawBuilding(t, c); drawDust(t); drawFigure(t, c);
};
</script></body></html>
