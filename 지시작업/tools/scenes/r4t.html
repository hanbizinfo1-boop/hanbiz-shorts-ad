<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 10-20 4번 «근데 갖고 있는 동안 / 돈이 되려면 / 임차인이 있어야 됩니다 / 확실한 임차인이 / 월세를 잘 내줘야 / 돈이 되는거에요» — 사장님 원문은 지시작업/tools/r4t_build.py 머리.
     900×1600 · 59.94 · 장면 0초 = 시퀀스 29.446. 사장님 안쪽 안전선 x 90~808 · 자막(~950) 밑.
     건물 = HTML(벽돌 + 3층 × 2칸 방) · 집주인 표정 3 · 임차인 6 = Codex(set11_tenant) → rembg 누끼 -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:900px;height:1600px;overflow:hidden;background:transparent}
#st{position:relative;width:900px;height:1600px;overflow:hidden;font-family:"HM GmarketSans","HM Pretendard",sans-serif}
.a{position:absolute;left:0;top:0;will-change:transform,opacity}
#bld{position:absolute;left:305px;top:985px;width:500px;height:450px;transform-origin:50% 100%}
#bld .face{position:absolute;inset:30px 0 0 0;border-radius:6px 6px 0 0;
  background:repeating-linear-gradient(0deg,#8f4f3a 0 13px,#7e4433 13px 15px),linear-gradient(90deg,#9a5a43,#86493a);box-shadow:0 18px 30px rgba(0,0,0,.45)}
#bld .roof{position:absolute;left:-12px;right:-12px;top:14px;height:26px;border-radius:6px;background:linear-gradient(#4a4e57,#33363d)}
#bld .ground{position:absolute;left:0;right:0;bottom:0;height:22px;background:#d9d4c8}
.room{position:absolute;width:218px;height:120px;border:6px solid #2a2c31;border-radius:6px;overflow:hidden;background:#262a33}
.room .lit{position:absolute;inset:0;background-size:cover;background-position:center 60%;opacity:0}   /* 10-20 «각각 직업에 맞게 사무실이 꾸며져있고 거기서 일하는 느낌» — 직업별 방 그림(Codex set12_rooms) */
.room img{position:absolute;left:50%;bottom:-8px;height:112px;transform:translateX(-50%);opacity:0}
.room .spot{position:absolute;inset:0;background:radial-gradient(55% 75% at 50% 35%,rgba(255,255,235,.55),rgba(255,255,235,.12) 60%,rgba(0,0,0,.25) 100%);opacity:0}
#dim{position:absolute;inset:30px 0 0 0;background:rgba(0,0,0,.5);opacity:0}   /* 건물 벽만 어둡게 — 방(스포트라이트)은 위에 */
.own{position:absolute;left:0;top:0;height:400px;transform-origin:50% 100%}
.bill{position:absolute;left:0;top:0;width:96px;height:43px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.45))}
</style></head>
<body><div id="st">
  <div id="bld" data-box="bld"><div class="roof"></div><div class="face"></div><div id="dim"></div><div class="ground"></div></div>
</div>
<script>
window.W = 900; window.H = 1600; window.FPS = 59.94; window.DURATION = 6.64;
window.PALETTE = ['#ffffff', '#FFD43B', '#00FC00'];
const st = document.getElementById('st'), bld = document.getElementById('bld'), dim = document.getElementById('dim');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const wob = (x, f = 30, d = 9) => x <= 0 ? 0 : Math.cos(x * f) * Math.exp(-x * d);
const O = 29.446, at = s => s - O;
const show = (e, o) => { e.style.opacity = o; e.style.display = o > .001 ? 'block' : 'none'; };
const C = '../../소재/codex/';
const T = {bld: at(29.46), q: at(30.40), fill: at(31.19), spot: at(32.44), cash: at(33.41), pay: at(35.01), out: at(35.96), end: 6.64};

// 방 6칸(3층 × 2) — 건물 안 좌표
const TEN = ['r4t_ten_cafe', 'r4t_ten_office', 'r4t_ten_doctor', 'r4t_ten_salon', 'r4t_ten_shop', 'r4t_ten_gym'];
const RBG = ['r4t_room_cafe', 'r4t_room_office', 'r4t_room_clinic', 'r4t_room_salon', 'r4t_room_shop', 'r4t_room_gym'];
const ROOMS = TEN.map((n, i) => {
  const col = i % 2, row = Math.floor(i / 2), x = 20 + col * 242, y = 48 + row * 128;
  const r = document.createElement('div'); r.className = 'room'; r.style.left = x + 'px'; r.style.top = y + 'px';
  r.innerHTML = `<div class="lit" style="background-image:url(${C}${RBG[i]}.png)"></div><img src="${C}${n}_a.png"><div class="spot"></div>`; bld.appendChild(r);
  return {r, lit: r.querySelector('.lit'), img: r.querySelector('img'), spot: r.querySelector('.spot'), cx: 305 + x + 109, cy: 985 + y + 59, t: T.fill + [0, .06, .12, .18, .24, .30][i], ph: i * 1.3};
});
// 집주인 — 표정 3장 겹쳐 두고 바꿔 보임
const OWN = {worry: 'r4t_owner_worry_a.png', hope: 'r4t_owner_hope_a.png', happy: 'r4t_owner_happy_a.png'};
const OW = {}; Object.entries(OWN).forEach(([k, f]) => { const e = document.createElement('img'); e.className = 'own a'; e.src = C + f; e.dataset.box = 'own_' + k; e.dataset.boxGroup = 'own'; st.appendChild(e); OW[k] = e; });
const OX = 200, OB = 1440;
const Q = document.createElement('div'); Q.className = 'a'; Q.textContent = '?';
Object.assign(Q.style, {fontWeight: 700, fontSize: '96px', color: '#FFD43B', WebkitTextStroke: '6px #0b0b0d', paintOrder: 'stroke fill'}); st.appendChild(Q);
// 돈(지폐) — 방마다 하나
const BILLS = ROOMS.map((rm, i) => { const e = document.createElement('img'); e.className = 'bill a'; e.src = '../../소재/db1/money/bill_front_a.png'; st.appendChild(e); return {e, t: T.cash + i * .1, fly: T.pay + i * .06}; });
const SPK = Array.from({length: 10}, (_, i) => { const e = document.createElement('div'); e.className = 'a'; e.innerHTML = '<svg width="40" height="40" viewBox="-20 -20 40 40"><path d="M0,-18 L4,-4 L18,0 L4,4 L0,18 L-4,4 L-18,0 L-4,-4Z" fill="#FFD43B"/></svg>'; st.appendChild(e); e.a = i / 10 * 6.283; return e; });
window.EVENTS = [{t: T.bld, role: 'bld'}, {t: T.fill, role: 'fill'}, {t: T.spot, role: 'spot'}, {t: T.cash, role: 'cash'}, {t: T.pay, role: 'pay'}];

window.seek = async function (t) {
  const fade = clamp((T.end - t) / (T.end - T.out));
  // 건물: 위에서 «훅» 내려와 박힘
  const u = t - T.bld, k = Math.min(1, Math.pow(Math.max(0, u) / .18, 2)), sq = u > .18 ? .06 * wob(u - .18, 26, 9) : 0;
  bld.style.transform = `translateY(${-(1 - k) * 200}px) scale(${1 + sq},${1 - sq})`; show(bld, u >= 0 ? clamp(u / .05) * fade : 0);
  // 방: 불 켜지며 임차인 «꽉» 참 → 각자 일하는 몸짓
  ROOMS.forEach((rm, i) => {
    const v = t - rm.t, on = clamp(v / .1);
    rm.lit.style.opacity = on; rm.img.style.opacity = on;
    const bob = v > 0 ? Math.sin((t - rm.t) * (5 + i) + rm.ph) * 3 : 0, tilt = v > 0 ? Math.sin((t - rm.t) * (3 + i * .5) + rm.ph) * 2.5 : 0;
    rm.img.style.transform = `translateX(-50%) translateY(${(1 - back(v / .25)) * 60 + bob}px) rotate(${tilt}deg)`;
    // «확실한 임차인이» 스포트라이트(살짝) — 건물 전체를 조금 어둡게, 방마다 위에서 빛이 훑고 지나감
    const s = clamp((t - T.spot - i * .07) / .2) * clamp((T.cash + .2 - t) / .25);
    rm.spot.style.opacity = s; rm.r.style.filter = `brightness(${1 + .18 * s})`; rm.r.style.boxShadow = s > .01 ? `0 0 ${24 * s}px rgba(255,236,170,${.8 * s})` : 'none'; rm.spot.style.backgroundPosition = `${Math.sin((t - T.spot) * 6 + i) * 20}px 0`;
  });
  dim.style.opacity = clamp((t - T.spot) / .2) * clamp((T.cash + .2 - t) / .25) * fade;
  // 지폐: 방마다 «뿅» 나와 위에 떠 있음 → «돈이 되는거에요»에 집주인에게 빨려 들어감
  BILLS.forEach((b, i) => {
    const rm = ROOMS[i], v = t - b.t;
    if (v < 0) { show(b.e, 0); return; }
    const hx = rm.cx, hy = rm.cy - 70 + Math.sin(v * 4 + i) * 5, pop = back(v / .22);
    let x = hx, y = hy, sc = pop, o = 1;
    const f = (t - b.fly) / .42;
    if (f > 0) { const kk = eio(f), tx = OX, ty = OB - 220; x = hx + (tx - hx) * kk; y = hy + (ty - hy) * kk - 120 * Math.sin(Math.PI * kk); sc = 1 - .6 * kk; o = 1 - clamp((f - .85) / .15); }
    b.e.style.transform = `translate(${x - 48}px,${y - 21}px) rotate(${(i % 2 ? 8 : -8) * (1 - clamp(f))}deg) scale(${sc})`; show(b.e, o * fade);
  });
  // 집주인 표정 — 걱정(갖고 있는 동안 돈이 되려면) → 기대(임차인·스포트라이트·월세) → 환호(돈이 들어옴)
  const ownIn = eo((t - T.bld - .08) / .3);
  const face = t < T.fill ? 'worry' : t < T.pay + .25 ? 'hope' : 'happy';
  const jump = face === 'happy' ? Math.abs(Math.sin((t - T.pay - .25) * 9)) * 18 * Math.exp(-(t - T.pay - .25) * 2.5) : 0;
  const pulse = 1 + .05 * wob(t - (face === 'hope' ? T.fill : T.pay + .25), 24, 8);
  Object.entries(OW).forEach(([kk, e]) => {
    const h = 400, w = e.naturalWidth ? 400 * e.naturalWidth / e.naturalHeight : 170;
    e.style.transform = `translate(${OX - w / 2}px,${OB - h - jump + (1 - ownIn) * 80}px) scale(${pulse})`;
    show(e, kk === face ? ownIn * fade : 0);
  });
  // «돈이 되려면» 물음표
  const qk = clamp((t - T.q) / .15) * clamp((T.fill - t) / .1);
  Q.style.transform = `translate(${OX + 70}px,${OB - 470 + Math.sin(t * 5) * 6}px) scale(${back((t - T.q) / .25)}) rotate(${12 + Math.sin(t * 4) * 6}deg)`; show(Q, qk);
  // 환호 반짝이
  SPK.forEach(e => { const s = t - T.pay - .3, r = 60 + s * 260; show(e, s > 0 && s < .7 ? 1 - s / .7 : 0); e.style.transform = `translate(${OX - 20 + Math.cos(e.a) * r}px,${OB - 250 + Math.sin(e.a) * r * .8}px) rotate(${s * 200}deg)`; });
};
</script></body></html>
