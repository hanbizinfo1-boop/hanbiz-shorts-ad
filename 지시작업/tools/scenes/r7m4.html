<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 10-21 7번 상담 모자이크 V2 띠 판 — 사장님 «약간 처음에 사진이 왼쪽오른쪽 왼쪽오른쪽 이런식으로 움직이면서 좀 띠처럼 돌다가 건물로 형성되는 느낌으로가보자»
     → 줄마다 번갈아 ←/→ 흐르는 사진 띠(화면 전체) · 첫 장은 제자리 · 띠가 0.47초 감속하며 5.62 에 건물 칸에 맞물림 · 건물 밖 사진은 바깥부터 사라짐 · 6.00 번쩍 → 실제 건물.
     앞 판 r7m3(완성도 판)의 밤거리 바탕·카메라 강약·켄 번즈·빛 물결·금빛 띠는 그대로. 900×1600 · 59.94 · 장면 0초 = 시퀀스 3.971. 칸 자리 r7m3_cells.js(tools/r7m2_build.py night) -->
<script src="r7m3_cells.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:900px;height:1600px;overflow:hidden;background:transparent}
#st{position:relative;width:900px;height:1600px;overflow:hidden;background:#0c0d10}
#w{position:absolute;left:0;top:0;width:900px;height:1600px;transform-origin:0 0;will-change:transform}
.ni{position:absolute;top:0;height:1600px;background-size:100% 100%}
#nb{filter:blur(18px) brightness(.32) saturate(.8)}
.tile{position:absolute;background-size:118% 118%;box-shadow:0 0 0 .8px rgba(255,255,255,.8);will-change:transform,opacity,filter}
.mk{position:absolute;top:0;height:1600px;-webkit-mask-size:100% 100%;mask-size:100% 100%}
#fl{background:#FFD27A;z-index:3}
#sweep{overflow:hidden;z-index:3}
#band{position:absolute;top:0;width:260px;height:1600px;background:linear-gradient(100deg,rgba(255,236,190,0) 0%,rgba(255,232,180,.55) 50%,rgba(255,236,190,0) 100%)}
#vig{position:absolute;inset:0;background:radial-gradient(110% 75% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
</style></head>
<body><div id="st"><div id="w"><div class="ni" id="nb"></div><div class="ni" id="ns"></div><div id="tiles"></div><div class="mk" id="fl"></div><div class="mk" id="sweep"><div id="band"></div></div></div><div id="vig"></div></div>
<script>
window.W = 900; window.H = 1600; window.FPS = 59.94; window.DURATION = 3.153;
window.PALETTE = ['#ffffff', '#FFD43B'];
const R = window.R7M3, P = '../../소재/r4s5/', NI = '../../소재/codex/r7m_night.png', NM = '../../소재/codex/r7m_night_bld.png';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const expo = x => { x = clamp(x); return x === 0 ? 0 : x === 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2; };
const bump = x => (x <= 0 || x >= 1) ? 0 : Math.sin(Math.PI * x);
const O = 3.971, at = s => s - O;
const show = (e, o) => { e.style.opacity = o; e.style.display = o > .001 ? 'block' : 'none'; };
const T = {z0: at(4.55), z1: at(5.45), dec: at(5.15), lock: at(5.62), flash: at(6.00), glow: at(6.50), out: at(6.98), end: 3.153};
const st = document.getElementById('st'), w = document.getElementById('w');
const nb = document.getElementById('nb'), ns = document.getElementById('ns'), fl = document.getElementById('fl'), sweep = document.getElementById('sweep'), band = document.getElementById('band');
[nb, ns, fl, sweep].forEach(e => Object.assign(e.style, {left: R.ox + 'px', width: R.nw + 'px'}));
nb.style.backgroundImage = ns.style.backgroundImage = `url(${NI})`;
[fl, sweep].forEach(e => { e.style.webkitMaskImage = e.style.maskImage = `url(${NM})`; });
const H0 = R.cells[R.hero], HX = H0.x + R.tw / 2, HY = H0.y + R.th / 2;
const S0 = 600 / R.tw;

// ── 카메라: 첫 장에 머물며 천천히 다가감 → 지수 곡선으로 훅 빠짐 → 살짝 더 밀려났다 섬 → 번쩍 뒤 다시 천천히 다가감
function cam(t) {
  const hold = S0 * (1 + .07 * eio(t / T.z0));
  const base = Math.exp(Math.log(hold) * (1 - expo((t - T.z0) / (T.z1 - T.z0))));
  const s = base * (1 - .045 * bump((t - T.z1 + .06) / .34)) * (1 + .06 * eio((t - T.flash) / (T.end - T.flash)));
  const m = clamp((1 / base - 1 / hold) / (1 - 1 / hold));
  return {s, fx: HX + (450 - HX) * m, fy: HY + (800 - HY) * m, sy: 520 + (800 - 520) * m};
}
// ── 띠 속도(화면 px/s): 첫 장 동안 천천히 → 줌아웃하며 빨라짐 → 0.47초 감속(속도 직선 감소 = 위치 2차 감속)으로 건물 칸에 맞물림
function vs(t) {
  if (t < T.z0) return 150 + 110 * eio(t / T.z0);
  if (t < T.dec) return 260 + 640 * eio((t - T.z0) / (T.dec - T.z0));
  return 900 * clamp(1 - (t - T.dec) / (T.lock - T.dec));
}
// 맞물릴 때까지 남은 거리(세계 px) = ∫ₜ^lock vs/s — 미리 표로
const DT = 1 / 1200, IT = [];
{
  const n = Math.ceil(T.lock / DT) + 1, v = [];
  for (let i = 0; i <= n; i++) v.push(vs(i * DT) / cam(i * DT).s);
  IT[n] = 0;
  for (let i = n - 1; i >= 0; i--) IT[i] = IT[i + 1] + (v[i] + v[i + 1]) / 2 * DT;
}
const remain = t => { if (t >= T.lock) return 0; const f = Math.max(0, t) / DT, i = Math.floor(f); return IT[i] + (IT[i + 1] - IT[i]) * (f - i); };
const DMAX = remain(0);

// ── 칸: 건물 칸(진짜) + 띠를 화면 끝까지 채우는 칸(건물 밖 · 맞물리며 사라짐). 첫 장은 띠에서 빼고 제자리(그 자리엔 다른 사진이 지나감)
let seed = 17; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const IMGS = [...new Set(R.cells.map(c => c.img))].filter(n => n !== H0.img);
const home = new Map(R.cells.map((c, i) => [c.x + ',' + c.y, i]));
const host = document.getElementById('tiles');
const TL = [];
const cMin = Math.floor((-160 - DMAX - H0.x) / R.tw), cMax = Math.ceil((1060 + DMAX - H0.x) / R.tw);
const rMin = Math.floor((-120 - H0.y) / R.th), rMax = Math.ceil((1720 - H0.y) / R.th);
for (let r = rMin; r <= rMax; r++) {
  const y = H0.y + r * R.th, dir = (r & 1) ? 1 : -1;                     // 줄마다 번갈아 → / ←
  for (let c = cMin; c <= cMax; c++) {
    const x = H0.x + c * R.tw, i = home.get(x + ',' + y);
    const real = i !== undefined && i !== R.hero;
    const img = real ? R.cells[i].img : IMGS[Math.floor(rnd() * IMGS.length)];
    const ph = real ? R.cells[i].ph : rnd() * 6.28, d = real ? R.cells[i].d : rnd();
    const e = document.createElement('div'); e.className = 'tile';
    Object.assign(e.style, {left: '0px', top: y + 'px', width: R.tw + 'px', height: R.th + 'px', backgroundImage: `url(${P}${img})`});
    host.appendChild(e);
    const dx = Math.max(R.bx0 - x - R.tw, x - R.bx1, 0), dy = Math.max(R.by0 - y - R.th, y - R.by1, 0);
    TL.push({e, x, y, dir, real, ph, d, yn: clamp((y - R.by0) / (R.by1 - R.by0)), far: clamp(Math.hypot(dx, dy) / 500), under: i === R.hero});
  }
}
{
  const e = document.createElement('div'); e.className = 'tile';
  Object.assign(e.style, {left: H0.x + 'px', top: H0.y + 'px', width: R.tw + 'px', height: R.th + 'px', backgroundImage: `url(${P}${H0.img})`, zIndex: 2});
  host.appendChild(e);
  TL.push({e, x: H0.x, y: H0.y, dir: 0, real: true, ph: H0.ph, d: H0.d, yn: (H0.y - R.by0) / (R.by1 - R.by0), far: 0});
}
window.EVENTS = [{t: 0, role: 'hero_in'}, {t: T.z0, role: 'zoom'}, {t: T.lock, role: 'lock'}, {t: T.flash, role: 'flash'}, {t: T.glow, role: 'sweep'}];

window.seek = async function (t) {
  show(st, eo(t / .2) * (1 - eio((t - T.out) / (T.end - T.out))));
  const C = cam(t);
  w.style.transform = `translate(450px,${C.sy}px) scale(${C.s}) translate(${-C.fx}px,${-C.fy}px)`;
  const off = remain(t);
  const vx0 = C.fx - 450 / C.s - R.tw * 1.2, vx1 = C.fx + 450 / C.s + R.tw * .2, vy0 = C.fy - C.sy / C.s - R.th * 1.2, vy1 = C.fy + (1600 - C.sy) / C.s + R.th * .2;
  TL.forEach(c => {
    const x = c.x - c.dir * off;                                          // 맞물릴 자리까지 남은 만큼 뒤에서 따라옴
    // 건물 밖 칸(첫 장 밑을 지나던 칸 포함): 감속 막바지에 바깥부터 작아지며 사라짐
    const fade = c.real ? 0 : clamp((t - (T.lock - .34 + .2 * (1 - c.far) + (c.under ? .3 : 0))) / .22);
    const wv = c.real ? bump((t - (T.lock - .02 + (1 - c.yn) * .32)) / .2) : 0;
    const gone = c.real ? clamp((t - (T.flash - .02 + (1 - c.yn) * .22 + c.d * .05)) / .1) : 0;
    const o = (1 - fade) * (1 - gone);
    if (o <= .001 || x < vx0 || x > vx1 || c.y < vy0 || c.y > vy1) { c.e.style.display = 'none'; return; }
    c.e.style.left = x + 'px';
    const px = 50 + 40 * Math.sin(t * .9 + c.ph), py = 50 + 40 * Math.cos(t * .7 + c.ph);
    c.e.style.backgroundPosition = `${px}% ${py}%`;
    c.e.style.filter = `brightness(${1 + .55 * wv})`;
    c.e.style.transform = `scale(${(1 + .14 * wv) * (1 - .25 * gone) * (1 - .4 * fade)})`;
    show(c.e, o);
  });
  show(ns, eo((t - T.flash + .05) / .35));
  show(fl, .5 * clamp((t - T.flash + .02) / .03) * (1 - clamp((t - T.flash - .02) / .16)));
  // ── 6.50 금빛이 건물을 쓸고 지나감
  const g = (t - T.glow) / .55;
  show(sweep, g > 0 && g < 1 ? 1 : 0);
  band.style.transform = `translateX(${(R.bx0 - R.ox - 300) + (R.bx1 - R.bx0 + 600) * eio(g)}px) skewX(-12deg)`;
};
window.__dbg = {DMAX, n: TL.length};
</script></body></html>
