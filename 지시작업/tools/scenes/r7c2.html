<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 10-21 7번 28.145~29.997 «실제 사례로 / 알려드리겠습니다» 2판 — 카페 → 상담 후기 클릭 → 실제 후기가 화면을 덮으며 한 줄씩 형광펜(화면 전체 V1).
     사장님 «그리고 카페도 그냥 카페들어가서 클릭했더니 성공사례가 나오면서 화면을 뒤덮는 느낌 뭔가 성공사례가 읽혀지게끔» → 추천 A/B/C → «1. b안 2. 빼자(책 퐁당) 3 실제사례위주로만 폴더에있는»
     ① 0~0.38 앞 장면(홀로그램) 마지막 화면이 뒤로 물러나고 카페 화면(사장님 캡처 그대로 · cafe_page.jpg)이 앞으로 ② 0.42~0.64 커서가 «황소장님 상담 후기» 메뉴 → 딸깍
     ③ 0.66~ 실제 후기 캡처 4장(소재/r7c/card0~3 — 작성자 이름·사진 가림)이 0.22초 간격으로 계단처럼 떨어져 화면을 덮음 · 장마다 그 글의 실제 문장 한 줄이 크게 노란 형광펜으로 그어짐.
     3판 «상담후기 본문이 블러처리 안됐으면 좋겠어» → 본문 덮던 반투명 흰 띠 뺌 · 형광펜 문장은 카드 맨 위 줄(본문 밖) · 후기 그림은 원본 해상도에서.
     4판 «이거만 보이잖아 아니 내용이 보이게끔 뭔가 후기쓴게 내용이 초반 3줄이라도 좀 보이게해줘» → 카드 = 캡처 제목 줄(head0~3) + 그 글의 실제 본문 3~4줄을 큰 글씨로 · 핵심 문장은 본문 안에서 형광펜(작성자 줄은 아예 안 씀).
     900×1600 · 59.94 · 장면 0초 = 시퀀스 28.145(17:39 저장본). -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:900px;height:1600px;overflow:hidden;background:transparent;font-family:"HM Pretendard"}
#st{position:absolute;inset:0;overflow:hidden;background:#0c1018}
#last{position:absolute;inset:0;background:url('../../소재/r7c/last.jpg') center/cover}
#cafe{position:absolute;left:0;top:0;width:900px;height:1600px;background:#fff;overflow:hidden;transform-origin:50% 40%}
#addr{position:absolute;left:0;top:0;width:900px;height:118px;background:#f1f3f4;border-bottom:1px solid #dadce0}
#addr .pill{position:absolute;left:30px;right:30px;top:30px;height:58px;border-radius:29px;background:#fff;box-shadow:inset 0 0 0 1px #dadce0;font:500 30px/58px "HM Pretendard";color:#202124;padding-left:74px}
#addr .pill:before{content:"";position:absolute;left:28px;top:18px;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 3px #5f6368}
#page{position:absolute;left:0;top:118px;width:900px;height:1024px;background:url('../../소재/r7c/cafe_page.jpg') 0 0/900px 1024px}
#more{position:absolute;left:0;top:1142px;width:900px;height:458px;background:#fff;padding:22px 26px}
#more .row{height:62px;border-bottom:1px solid #eee;display:flex;align-items:center;font:600 26px/1 "HM Pretendard";color:#333}
#more .row b{color:#03c75a;margin-right:14px;font-weight:800;font-size:22px}
#hl{position:absolute;left:130px;top:430px;width:120px;height:36px;border-radius:6px;background:rgba(3,199,90,.25);box-shadow:0 0 0 3px #03c75a}
#dim{position:absolute;inset:0;background:rgba(8,12,20,.55)}
.cd{position:absolute;left:40px;width:820px;height:560px;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 -6px 30px rgba(0,0,0,.45),0 0 0 3px rgba(3,199,90,.9)}
.cd .hd{position:absolute;left:0;top:6px;width:820px;height:auto}
.cd .bd{position:absolute;left:26px;right:26px;top:var(--ht,80px);font:600 31px/46px "HM Pretendard";color:#222;letter-spacing:-.4px;word-break:keep-all}
.cd .bd mark{color:#111;font-weight:900;padding:0 4px;background:linear-gradient(#ffe14d,#ffe14d) no-repeat 0 55%/var(--w,0%) 86%;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:4px}
#cur{position:absolute;width:56px;height:76px;margin:-6px 0 0 -6px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
#clk{position:absolute;border-radius:50%;border:4px solid #03c75a}
</style></head>
<body><div id="st">
  <div id="last"></div>
  <div id="cafe">
    <div id="addr"><div class="pill">cafe.naver.com/gameheaven77</div></div>
    <div id="page"></div>
    <div id="more">
      <div class="row"><b>강남빌딩 실전 정보집</b>강남빌딩 입지8법칙</div>
      <div class="row"><b>강남빌딩 실전 정보집</b>강남빌딩 협상7법칙(공사견적서 비교법)</div>
      <div class="row"><b>강남빌딩 실전 정보집</b>의사의 200억 강남빌딩 마스터플랜(기본편)</div>
      <div class="row"><b>강남빌딩 실전 정보집</b>의사의 500억 강남빌딩 로드맵</div>
      <div class="row"><b>성공사례&amp;후기</b>강남빌딩 성공사례</div>
      <div class="row"><b>성공사례&amp;후기</b>황소장님 상담 후기</div>
    </div>
    <div id="hl"></div>
  </div>
  <div id="dim"></div>
  <div id="cards"></div>
  <div id="clk"></div>
  <svg id="cur" viewBox="0 0 28 38"><path d="M2 2 L2 30 L9 23 L14 35 L19 33 L14 21 L24 21 Z" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/></svg>
</div>
<script>
window.W = 900; window.H = 1600; window.FPS = 59.94; window.DURATION = 1.852;
window.PALETTE = ['#03c75a', '#ffe14d', '#0c1018'];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c = 1.3; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const show = (e, o) => { e.style.opacity = o; e.style.display = o > .001 ? 'block' : 'none'; };
const T = {in: 0, cur: .40, click: .60, cards: .66, end: 1.852};
const $ = id => document.getElementById(id);
// 사장님 캡처 상단 탭 줄의 «황소장님 상담 후기» 자리(cafe_page 900 폭 기준)
const HX = 190, HY = 448;
// 실제 후기 4장 — 그 글 속 실제 문장
// 그 글의 실제 본문(캡처 그대로) — [앞, 형광펜, 뒤]
const Q = [['소장님과의 상담은 ', '시원시원하게 방향을 제시해 주셨습니다.', ' 부동산 상담을 처음 받아보는 거라서 무엇을 물어봐야하는 건지, 유투브로 보던 분을 실제로 보게 되서 떨렸는데'],
  ['저의 자금 및 현재 상황과 맞는 부동산을 찾는 방법에 대해 자세히 알려주셔서 큰 도움이 됐습니다. 소장님 유투브를 보면서 꼭 상담받고 싶었는데 오늘 상담하면서 ', '정말 상담오길 잘했다고 생각이 드네요.', ''],
  ['그래서 상담 신청을 하고 오늘 상담을 받고 왔습니다. ', '역시 실망시키지 않으셨습니다.', ' 막연히 가지고 있던, 또 망설여져서 생각만 했던 것들에 대해 상담을 하면서 앞으로 어떻게 노후를 준비해야 할지 정리할 수 있었습니다.'],
  ['개인적얘기라 후기에서 밝히긴 어렵지만 저처럼 집에서 혼자 머릿속으로만 투자 그림 그리시는 분들은 본인들이 아는게 다가 아니다란걸 명심하시고 ', '투자상담 받아보시는거 추천드립니다~', '']];
const HH = [68, 56, 84, 70];
const TOP = [110, 395, 680, 965], CT = Q.map((_, i) => T.cards + i * .22);
const CD = Q.map((q, i) => { const e = document.createElement('div'); e.className = 'cd';
  e.innerHTML = `<img class="hd" src="../../소재/r7c/head${i}.jpg"><div class="bd" style="--ht:${HH[i] + 22}px">${q[0]}<mark>${q[1]}</mark>${q[2]}</div>`;
  $('cards').appendChild(e); return e; });
window.EVENTS = [{t: 0, role: 'cafe_in'}, {t: T.click, role: 'click'}, ...CT.map(t => ({t, role: 'review'}))];

window.seek = async function (t) {
  // ── ① 앞 화면이 뒤로 물러나고 카페 화면이 앞으로
  const k = eio(t / .38);
  $('last').style.transform = `scale(${1 - .12 * k})`; $('last').style.filter = `brightness(${1 - .6 * k})`;
  show($('last'), k < 1 ? 1 : 0);
  $('cafe').style.transform = `translateY(${(1 - k) * 260}px) scale(${lerp(.86, 1, k)})`;
  $('cafe').style.borderRadius = 24 * (1 - k) + 'px';
  show($('cafe'), eo(t / .2));
  // ── ② 커서 → «황소장님 상담 후기» 딸깍
  const ck = eio((t - T.cur) / .2);
  Object.assign($('cur').style, {left: lerp(700, HX, ck) + 'px', top: lerp(1100, HY + 8, ck) + 'px', transform: `scale(${1 - .18 * Math.sin(Math.PI * clamp((t - T.click) / .1))})`});
  show($('cur'), t > T.cur - .02 && t < T.cards + .25 ? 1 : 0);
  show($('hl'), t > T.click ? 1 : 0);
  const rk = (t - T.click) / .25;
  Object.assign($('clk').style, {left: HX - 40 * rk + 'px', top: HY - 40 * rk + 'px', width: 80 * rk + 'px', height: 80 * rk + 'px'});
  show($('clk'), rk > 0 && rk < 1 ? 1 - rk : 0);
  // ── ③ 후기가 계단처럼 떨어져 화면을 덮음 · 형광펜
  show($('dim'), .9 * eo((t - T.cards) / .3));
  CD.forEach((e, i) => {
    const u = t - CT[i], a = back(u / .26);
    if (u <= 0) { show(e, 0); return; }
    e.style.top = TOP[i] + (1 - a) * -700 + 'px';
    e.style.transform = `rotate(${(i % 2 ? 1.2 : -1.2) * (1 - eo(u / .3))}deg)`;
    const hk = eo((u - .18) / .22), mk = e.querySelector('mark'); mk.style.setProperty('--w', 100 * hk + '%');
    show(e, 1);
  });
};
</script></body></html>
